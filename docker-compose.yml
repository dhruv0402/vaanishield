version: "3.8"

services:
  vaanishield-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaanishield:latest
    container_name: vaanishield_saas
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/threats", "-H", "X-API-Key: vs_test_sandbox_1234"]
      interval: 30s
      timeout: 10s
      retries: 3
