name: VaaniShield Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Static Code Quality & Linter Checks
  lint-and-audit:
    name: Lint & Static Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Python Syntax & Semantic Check
        run: |
          flake8 vaanishield demo scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Run Frontend Linter (oxlint)
        run: |
          cd web
          npm run lint

  # Job 2: Fast Clean-Checkout Tests & Metadata Audit (116 tests)
  test-and-verify:
    name: Clean-Checkout Tests & Acceptance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install Audio System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg build-essential python3-dev

      - name: Install Lightweight CI Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-ci.txt

      - name: Run Clean-Checkout Unit & Integration Tests (116 test cases)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Audit Tracked Metadata and Report Consistency
        run: |
          PYTHONPATH=. python scripts/verify.py --metadata-only

      - name: Validate Dataset Metadata Governance
        run: |
          PYTHONPATH=. python scripts/validate_dataset.py --metadata-only

  # Job 3: Frontend Web Dashboard Compilation
  frontend:
    name: Build Web Dashboard (Vite Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Dashboard Assets
        run: |
          cd web
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # Job 4: Container Build & Verification Smoke Test
  docker-smoke-test:
    name: Docker Multi-Stage Build & Container Healthcheck
    runs-on: ubuntu-latest
    needs: [lint-and-audit, test-and-verify, frontend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build VaaniShield Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: vaanishield:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container & Test Healthcheck Endpoint
        run: |
          docker run -d --name vaanishield-container -p 8000:8000 vaanishield:latest
          echo "Waiting for container and FastAPI to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/health; then
              echo "Healthcheck succeeded!"
              docker stop vaanishield-container
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck timed out!"
          docker logs vaanishield-container
          docker stop vaanishield-container
          exit 1
