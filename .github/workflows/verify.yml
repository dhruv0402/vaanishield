name: VaaniShield Tests & Metadata Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg build-essential python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-ci.txt

      - name: Run Unit & Integration Tests (pytest)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Audit Tracked Metadata and Report Consistency
        run: |
          PYTHONPATH=. python scripts/verify.py --metadata-only

      - name: Validate Dataset Metadata (Audio Not Distributed)
        run: |
          PYTHONPATH=. python scripts/validate_dataset.py --metadata-only

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Web Dashboard (Vite Frontend)
        run: |
          cd web
          npm ci
          npm run build
