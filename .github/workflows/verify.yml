name: VaaniShield Strict CI & Audit Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests (pytest)
        run: |
          pytest tests/ -v

      - name: Verify Strict 8-Point Acceptance Gate
        run: |
          python scripts/verify.py

      - name: Validate Dataset Governance & G-Eval Metrics
        run: |
          python scripts/validate_dataset.py

      - name: Build Web Dashboard (Vite Frontend)
        run: |
          cd web
          npm ci || npm install
          npm run build
